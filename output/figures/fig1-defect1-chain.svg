<svg xmlns="http://www.w3.org/2000/svg" width="660" height="528" viewBox="0 0 660 528" role="img">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#111">Figure 1. Defect 1: the five measured links between the registry's own</text>
  <text x="30" y="54" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#111">search box and a browser security interstitial.</text>
  <rect x="30" y="74" width="600" height="52" rx="5" fill="#fbfbfb" stroke="#333" stroke-width="1.4"/>
  <text x="44" y="95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="bold" fill="#111">1. The visitor uses the search box</text>
  <text x="44" y="112" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#333">ReBEC home page, https://ensaiosclinicos.gov.br - typed: dengue</text>
  <line x1="330.0" y1="126" x2="330.0" y2="148" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="30" y="148" width="600" height="70" rx="5" fill="#fbfbfb" stroke="#333" stroke-width="1.4"/>
  <text x="44" y="169" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="bold" fill="#111">2. The search widget decides where to go</text>
  <text x="44" y="186" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#333">cse.js?cx=ad5f3224a2a0fa826 carries one URL for this site:</text>
  <text x="44" y="204" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#333">http://www.ensaiosclinicos.gov.br/search/query/simple</text>
  <line x1="330.0" y1="218" x2="330.0" y2="240" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="30" y="240" width="600" height="70" rx="5" fill="#fbfbfb" stroke="#333" stroke-width="1.4"/>
  <text x="44" y="261" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="bold" fill="#111">3. The navigation is promoted from http to https</text>
  <text x="44" y="278" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#333">mechanism NOT isolated - either the site's own header</text>
  <text x="44" y="296" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#333">Content-Security-Policy: upgrade-insecure-requests, or the browser's HTTPS upgrade</text>
  <line x1="330.0" y1="310" x2="330.0" y2="332" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="30" y="332" width="600" height="70" rx="5" fill="#fbfbfb" stroke="#333" stroke-width="1.4"/>
  <text x="44" y="353" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="bold" fill="#111">4. The https request meets a certificate that does not cover the host</text>
  <text x="44" y="370" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#333">www.ensaiosclinicos.gov.br and ensaiosclinicos.gov.br both resolve to 140.82.26.58,</text>
  <text x="44" y="388" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#333">but the certificate carries a single SAN: DNS:ensaiosclinicos.gov.br</text>
  <line x1="330.0" y1="402" x2="330.0" y2="424" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="30" y="424" width="600" height="52" rx="5" fill="#fdf3f3" stroke="#8a1f1f" stroke-width="1.4"/>
  <text x="44" y="445" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="bold" fill="#111">5. The browser stops. The search never runs.</text>
  <text x="44" y="462" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#333">Chrome shows a privacy error; no request ever reaches the registry</text>
  <text x="30" y="506" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#555">All links measured 25 August 2026. Reproduce: see section 6.</text>
</svg>
