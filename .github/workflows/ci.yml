name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt

      # integrity of the committed seal comes first: if a sealed byte changed,
      # nothing downstream is worth running.
      - name: Verify provenance chain
        run: python scripts/verify_chain.py

      # full light replication: figures regenerate byte-identically, every
      # published number ties to the frozen data.
      - name: Replicate
        run: python run_all.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff interrogate
      - run: ruff format --check .
      - run: ruff check .
      - run: interrogate -f 100 code scripts tests run_all.py
